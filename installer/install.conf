# Enhanced Camera Control settings (build.sh). Copied to SYNC as
# /fs/images/fmods_apps_data/EnhancedCameraControl/install.conf.
# What it does: the front camera is on or off because you pressed its button. Nothing opens it by itself and a mode
# ending does not take it away; it works up to the camera module's own limit (about 19 mph); Park closes it; after
# Reverse it is as you left it. It works with or without Front Tire Guides, and reads or clears no module.

# The four switches below are also on SYNC's own page, Settings > Vehicle > Camera Settings (SETTINGS_PAGE=1), and
# what is chosen there wins: these are only the values a first install starts with.
#   CONTROL    the button rule itself ("Enhanced Camera Control": off = the camera stock in every respect, the three below without effect)
#   SPEED      SYNC's own front camera speed limits (6 mph, 15 off-road) lifted up to the camera module's limit, in
#              memory only: a SYNC restart without this mod is stock; the rear camera is untouched ("Extended
#              Speed Range")
#   AUTO_OPEN  keep the camera coming on by itself when an off-road mode is selected ("G.O.A.T. Mode Auto Camera Launch")
#   LAST_VIEW  the camera comes up in the front view used last, normal or split ("Remember Last View")
CONTROL=1
SPEED=1
AUTO_OPEN=0
LAST_VIEW=1

# SETTINGS_PAGE=1: the four switches are added to Ford's Camera Settings page (one file, RVCSettings.qml, as one marked
# block that uninstall takes out again; the install stops if that file is anything but Ford's stock one plus such
# blocks of ours). 0 = no switches; the values above are used.
SETTINGS_PAGE=1

# Started early: one line of ours in Ford's startup_gf.sh straight after the line that launches SYNC's services, so
# the rule is in force from the first moment the camera can be opened (F-Mods' launcher, the last thing in that
# script, runs about a minute after SYNC starts). 0 = F-Mods' launcher.
EARLY_START=1

# UNINSTALL=1: plugging this stick in takes Enhanced Camera Control off SYNC and puts Ford's file back, then restarts.
UNINSTALL=0
